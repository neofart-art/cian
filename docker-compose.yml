services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-172.31.1.1}:${APP_PORT:-3010}:8000"
    environment:
      APP_USER: ${APP_USER:?Set APP_USER in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-https://xata.neofart.ru}
      DATA_DIR: /data
    volumes:
      - xata_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  xata_data:
