name: XATA checks
on:
  push:
    branches: ["xata/initial-app"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xata-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_USER: ci
      APP_PASSWORD: ci-test-password-16
      BROWSER_SCHEDULE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-app.txt -r requirements-browser.txt pytest==8.3.5 pytest-timeout==2.3.1
      - name: Prepare immutable previous app for additive rollback regression
        run: |
          git fetch --no-tags --depth=1 origin 3d72b59d6d296f032b0396aa79e9bdb4cf6c42f0
          git worktree add --detach "$RUNNER_TEMP/xata-ui-base" FETCH_HEAD
          echo "XATA_OLD_ROOT=$RUNNER_TEMP/xata-ui-base" >> "$GITHUB_ENV"
      - name: Prepare immutable performance baseline
        run: |
          git fetch --no-tags --depth=1 origin 21c0d7405fd2b849ca7db69057cd4f9bf46e362b
          git worktree add --detach "$RUNNER_TEMP/xata-perf-base" FETCH_HEAD
          echo "XATA_PERF_BASE_ROOT=$RUNNER_TEMP/xata-perf-base" >> "$GITHUB_ENV"
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Benchmark 500 apartments before and after over shaped loopback HTTP
        run: python scripts/benchmark_state.py
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xata-performance
          path: artifacts/performance.json
          if-no-files-found: warn
      - name: Validate both Compose modes and JavaScript
        run: |
          docker compose -p xata config --quiet
          docker compose -p xata -f docker-compose.yml -f docker-compose.browser-login.yml config --quiet
          node --check app/static/app.js
          node --check app/static/comments.js
          node --check app/static/visits.js
          node --check app/static/compare.js
          node --check app/static/login.js
          node --check app/static/review-state.js
          node --check scripts/diagnose_ui.js
          node --test tests/review_state.test.cjs tests/listing_diagnostics.test.cjs
      - name: Install test Chromium and WebKit
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium webkit
      - name: Offline DOM and persistent-profile tests
        env:
          UI_SCREENSHOT_DIR: artifacts/ui-screenshots
        run: RUN_BROWSER_TESTS=1 python -m pytest -v --tb=short --timeout=180 --maxfail=3 tests/test_browser_dom.py tests/test_ui.py tests/test_comments_ui.py tests/test_feed_ui.py
      - name: Prepare readable screenshot preview
        if: always()
        run: python tests/screenshot_contact.py
      - name: Upload desktop and mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xata-ui-screenshots
          path: artifacts/ui-screenshots
          if-no-files-found: warn
      - name: Build both containers
        run: |
          docker build -t xata-app-test .
          docker build -f Dockerfile.browser -t xata-browser-test .
          docker run --rm --entrypoint python xata-app-test -c "from datetime import date; from app.viewings import calendar_timestamp; assert calendar_timestamp(date(2026, 11, 1)).isoformat() == '2026-10-31T21:00:00+00:00'"
      - name: Headed browser container smoke test, no Cian navigation
        run: |
          docker run -d --name xata-browser-smoke --init --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 1g --cpus 1 --pids-limit 256 --shm-size 256m --tmpfs /tmp:size=128m,mode=1777 --tmpfs /home/browser:size=16m,uid=10001,gid=10001,mode=700 -e HOME=/home/browser -e BROWSER_API_TOKEN=ci-test-password-16 -v xata-browser-smoke-profile:/profile xata-browser-test
          for attempt in $(seq 1 60); do
            if docker exec xata-browser-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)" >/dev/null 2>&1; then
              docker exec xata-browser-smoke python -c "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8010/status', headers={'Authorization':'Bearer ci-test-password-16'}); assert b'unknown' in urllib.request.urlopen(r).read()"
              exit 0
            fi
            sleep 1
          done
          docker logs xata-browser-smoke
          exit 1
      - name: Temporary noVNC mode and retained profile volume
        run: |
          docker exec xata-browser-smoke python -c "from pathlib import Path; Path('/profile/smoke-marker').write_text('retained')"
          docker exec xata-browser-smoke x11vnc -storepasswd testpass /profile/vnc.pass
          docker stop xata-browser-smoke
          docker rm xata-browser-smoke
          docker run -d --name xata-browser-smoke --init --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 1g --cpus 1 --pids-limit 256 --shm-size 256m --tmpfs /tmp:size=128m,mode=1777 --tmpfs /home/browser:size=16m,uid=10001,gid=10001,mode=700 -e HOME=/home/browser -e BROWSER_API_TOKEN=ci-test-password-16 -e BROWSER_MANUAL_ACCESS=1 -p 127.0.0.1:16080:6080 -v xata-browser-smoke-profile:/profile xata-browser-test
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:16080/vnc.html >/dev/null; then
              docker exec xata-browser-smoke python -c "from pathlib import Path; import socket; assert Path('/profile/smoke-marker').read_text() == 'retained'; s=socket.create_connection(('127.0.0.1', 5900), timeout=3); assert s.recv(12).startswith(b'RFB'); s.close()"
              exit 0
            fi
            sleep 1
          done
          docker logs xata-browser-smoke
          exit 1
      - name: Clean up smoke container
        if: always()
        run: |
          docker rm -f xata-browser-smoke || true
          docker volume rm xata-browser-smoke-profile || true
