<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход · ХАТА</title><link rel="stylesheet" href="/static/style.css"><script src="/static/login.js" defer></script></head>
<body><main class="login-shell"><div class="brand">ХАТА</div><p>Войдите, чтобы выбирать квартиру вместе.</p><section class="panel"><form id="login-form"><div><label for="username">Логин</label><input id="username" name="username" maxlength="128" autocomplete="username" required autofocus></div><div><label for="password">Пароль</label><input id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required></div><button id="login-submit" type="submit" disabled>Войти</button></form><p id="login-message" role="status" aria-live="polite">Подготовка входа…</p></section></main></body></html>
